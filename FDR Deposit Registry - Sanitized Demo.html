<style>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var TODAY=(function(){var d=new Date();d.setHours(0,0,0,0);return d;})();
function fmtISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function off(n){var d=new Date(TODAY);d.setDate(d.getDate()+n);return fmtISO(d);}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function daysTo(s){return Math.round((parse(s)-TODAY)/864e5);}
function fmtDate(s){return parse(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTime(d){return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}
function inr(n){return '₹'+Number(n).toLocaleString('en-IN');}
function inrShort(n){return n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(1)+' L':inr(n);}
function rel(d){return d<0?Math.abs(d)+' d overdue':d===0?'today':'in '+d+' d';}
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,'0');}

/* ---------- reference data ---------- */
var INSTS=[
 {id:'i1',aicte:'DEMO-ORG-01',name:'Example Institute 01',cat:'Engineering',state:'Demo State',region:'Demo Region',spoc:'contact-01@example.invalid'},
 {id:'i2',aicte:'DEMO-ORG-02',name:'Example Institute 02',cat:'Management',state:'Demo State',region:'Demo Region',spoc:'contact-02@example.invalid'},
 {id:'i3',aicte:'DEMO-ORG-03',name:'Example Institute 03',cat:'Pharmacy',state:'Demo State',region:'Demo Region',spoc:'contact-03@example.invalid'},
 {id:'i4',aicte:'DEMO-ORG-04',name:'Example Institute 04',cat:'Architecture',state:'Demo State',region:'Demo Region',spoc:'contact-04@example.invalid'},
 {id:'i5',aicte:'DEMO-ORG-05',name:'Example Institute 05',cat:'Engineering',state:'Demo State',region:'Demo Region',spoc:'contact-05@example.invalid'},
 {id:'i6',aicte:'DEMO-ORG-06',name:'Example Institute 06',cat:'Management',state:'Demo State',region:'Demo Region',spoc:'contact-06@example.invalid'}
];
var ROLES={
 spoc:{label:'Institution SPOC',name:'Alex Example',inst:'i1'},
 regional:{label:'Regional Officer',name:'R. Example'},
 bureau:{label:'Bureau Officer',name:'S. Example'}
};
var ST={
 ACTIVE:{l:'Active',c:'ok'},EXPIRING_SOON:{l:'Expiring soon',c:'warn'},MATURED:{l:'Matured',c:'crit'},
 PENDING_VERIFICATION:{l:'Pending verification',c:'info'},DISCREPANCY:{l:'Discrepancy',c:'crit'},
 RENEWAL_SUBMITTED:{l:'Renewal submitted',c:'info'},RELEASE_REQUESTED:{l:'Release requested',c:'info'},
 RELEASED:{l:'Released',c:'mute'},RENEWED:{l:'Renewed',c:'mute'},REJECTED:{l:'Rejected',c:'crit'}
};
var WF2ST={pending:'PENDING_VERIFICATION',discrepancy:'DISCREPANCY',renewal_submitted:'RENEWAL_SUBMITTED',release_requested:'RELEASE_REQUESTED',released:'RELEASED',renewed:'RENEWED',rejected:'REJECTED'};
var KEYS=[['no','FDR number'],['bank','Issuing bank'],['amount','Amount'],['maturity','Maturity date']];
var TYPES=['FDR','Bank Guarantee','Security Deposit'];

function inst(id){return INSTS.filter(function(i){return i.id===id;})[0];}
function pill(s){var m=ST[s];return '<span class="pill '+m.c+'"><i></i>'+m.l+'</span>';}
function status(f){
  if(f.wf!=='verified')return WF2ST[f.wf];
  var d=daysTo(f.maturity);
  return d<0?'MATURED':d<=90?'EXPIRING_SOON':'ACTIVE';
}

/* ---------- mock scan + bank feed ---------- */
function makeScan(f,mode){
  var ocr={no:f.no,bank:f.bank,amount:f.amount,maturity:f.maturity};
  var feed={status:'Confirmed',no:f.no,bank:f.bank,amount:f.amount,maturity:f.maturity};
  if(mode==='maturity'){var d=parse(f.maturity);d.setDate(d.getDate()+30);ocr.maturity=fmtISO(d);feed.maturity=ocr.maturity;}
  if(mode==='amount'){ocr.amount=Math.round(f.amount*0.9);feed.amount=ocr.amount;}
  if(mode==='norecord'){feed={status:'No record found'};}
  return {ocr:ocr,feed:feed};
}
function mk(o){
  var sc=makeScan(o,o.scan||'same');
  var f=Object.assign({type:'FDR',branch:'',lien:'Lien marked in favour of Demo Authority',approvals:[],wf:'verified',renewalOf:null,renewedBy:null,file:'fdr-scan.pdf'},o);
  delete f.scan;
  if(!f.lockIn){var l=parse(f.issued);l.setDate(l.getDate()+365);f.lockIn=fmtISO(l);}
  f.ocr=sc.ocr;f.feed=sc.feed;return f;

function nextStep(f){
  var s=status(f),r=state.role;

  if(s==='DISCREPANCY')return r==='spoc'?'An officer is reviewing a mismatch':'Scan or bank feed differs from the form';

    var locked=daysTo(f.lockIn)>0;
    acts+='<button class="btn" type="button" data-a="release" data-id="'+f.id+'"'+(locked?' disabled':'')+'>Request release</button>';
  }
  if(f.wf==='release_requested'&&r==='regional'&&f.approvals.length===0)acts+='<button class="btn pri" type="button" data-a="approve" data-id="'+f.id+'">Approve release (tier 1)</button>';
  if(f.wf==='release_requested'&&r==='bureau'&&f.approvals.length===1)acts+='<button class="btn pri" type="button" data-a="approve" data-id="'+f.id+'">Approve release (tier 2)</button>';
  if((f.wf==='pending'||f.wf==='discrepancy')&&r!=='spoc')acts+='<button class="btn pri" type="button" data-a="goverify" data-id="'+f.id+'">Review in verification</button>';
  var hint='';
  if(held&&daysTo(f.lockIn)>0&&(r==='spoc'||r==='bureau'))hint='<p class="hint">Release opens after the lock-in period ends on '+fmtDate(f.lockIn)+'.</p>';
  if(!acts)hint+='<p class="hint">No actions are available to your role on this instrument right now.</p>';
  var steps='';
  if(f.wf==='release_requested'||f.wf==='released'){
    var n=f.approvals.length;
    steps='<h3>Release sign-off</h3><ol class="steps"><li class="done">Release requested</li><li class="'+(n>=1?'done':'')+'">Tier 1: Regional Officer'+(n>=1?' ('+esc(f.approvals[0].by)+')':'')+'</li><li class="'+(n>=2?'done':'')+'">Tier 2: Bureau Officer'+(n>=2?' ('+esc(f.approvals[1].by)+')':'')+'</li></ol>';
  }
  var link='';
  if(f.renewalOf)link+='<dt>Renewal of</dt><dd><button class="btn" type="button" data-a="open" data-id="'+f.renewalOf+'" style="padding:2px 8px"><span class="mono">'+esc(get(f.renewalOf).no)+'</span></button></dd>';
  if(f.renewedBy)link+='<dt>Replaced by</dt><dd><button class="btn" type="button" data-a="open" data-id="'+f.renewedBy+'" style="padding:2px 8px"><span class="mono">'+esc(get(f.renewedBy).no)+'</span></button></dd>';
  var hist=audit.filter(function(e){return e.fid===f.id;}).reverse().map(function(e){return '<li><time>'+fmtTime(e.at)+'</time><span><b>'+e.action+'</b> · '+esc(e.actor)+(e.detail?'<br><span style="color:var(--muted)">'+esc(e.detail)+'</span>':'')+'</span></li>';}).join('');
  return '<button class="x" type="button" data-a="close" aria-label="Close">✕</button>'+
   '<header><h2>'+esc(i.name)+'</h2><span class="mono">'+esc(f.type)+' '+esc(f.no)+'</span><div style="margin-top:8px">'+pill(s)+'</div></header>'+
   '<dl><dt>Amount</dt><dd><b>'+inr(f.amount)+'</b></dd><dt>Issuing bank</dt><dd>'+esc(f.bank)+(f.branch?', '+esc(f.branch):'')+'</dd>'+
   '<dt>Issued</dt><dd>'+fmtDate(f.issued)+'</dd><dt>Matures</dt><dd>'+fmtDate(f.maturity)+(['RELEASED','RENEWED','REJECTED'].indexOf(s)<0?' ('+rel(d)+')':'')+'</dd>'+
   '<dt>Lock-in ends</dt><dd>'+fmtDate(f.lockIn)+'</dd><dt>Lien</dt><dd>'+esc(f.lien)+'</dd>'+
   '<dt>Demo Authority ID</dt><dd class="mono">'+esc(i.aicte)+'</dd><dt>Category, region</dt><dd>'+esc(i.cat)+', '+esc(i.region)+' ('+esc(i.state)+')</dd>'+
   '<dt>Scan</dt><dd>'+esc(f.file)+'</dd>'+link+'</dl>'+
   '<div class="acts">'+acts+'</div>'+hint+steps+'<h3>History</h3><ul class="hist">'+hist+'</ul>';
}

/* ---------- submission form ---------- */
function formHTML(old){
  var spoc=state.role==='spoc';
  var il=INSTS.filter(function(i){return old?i.id===old.inst:spoc?i.id===ROLES.spoc.inst:true;});
  var io=il.map(function(i){return '<option value="'+i.id+'">'+esc(i.name)+' ('+esc(i.aicte)+')</option>';}).join('');
  var to=TYPES.map(function(t){return '<option'+(old&&old.type===t?' selected':'')+'>'+t+'</option>';}).join('');
  var v=function(k,d){return esc(old&&old[k]!=null?old[k]:d||'');};
  return '<button class="x" type="button" data-a="close" aria-label="Close">✕</button>'+
   '<h2>'+(old?'Upload renewed receipt':'New deposit')+'</h2>'+
   '<p class="hint">'+(old?'This renews <span class="mono">'+esc(old.no)+'</span>. The old instrument stays on record and is archived once the new one is verified.':'The scan is read automatically and checked against the bank feed before an officer verifies it.')+'</p>'+
   '<form id="fdrForm" class="form" novalidate>'+
   '<div class="f full"><label for="ff-inst">Institution</label><select id="ff-inst">'+io+'</select></div>'+
   '<div class="f"><label for="ff-type">Instrument type</label><select id="ff-type">'+to+'</select></div>'+
   '<div class="f"><label for="ff-no">FDR / reference number</label><input type="text" id="ff-no" autocomplete="off"><span class="err" id="err-no"></span></div>'+
   '<div class="f"><label for="ff-bank">Issuing bank</label><input type="text" id="ff-bank" value="'+v('bank')+'"><span class="err" id="err-bank"></span></div>'+
   '<div class="f"><label for="ff-branch">Branch</label><input type="text" id="ff-branch" value="'+v('branch')+'"></div>'+
   '<div class="f"><label for="ff-amount">Amount (₹)</label><input type="number" id="ff-amount" min="1" step="1" value="'+v('amount')+'"><span class="err" id="err-amount"></span></div>'+
   '<div class="f"><label for="ff-lien">Lien details</label><input type="text" id="ff-lien" value="'+v('lien','Lien marked in favour of Demo Authority')+'"></div>'+
   '<div class="f"><label for="ff-issued">Issue date</label><input type="date" id="ff-issued" value="'+off(0)+'"><span class="err" id="err-issued"></span></div>'+
   '<div class="f"><label for="ff-maturity">Maturity date</label><input type="date" id="ff-maturity" value="'+(old?off(365):'')+'"><span class="err" id="err-maturity"></span></div>'+
   '<div class="f full"><label for="ff-file">Scanned copy (PDF or image)</label><input type="file" id="ff-file" accept=".pdf,image/*"><span class="hint" style="margin:0">If you skip this, a sample scan is used for the demo.</span></div>'+
   '<div class="f full demo"><label for="ff-scan">Prototype control: what the scan and bank feed return</label><select id="ff-scan"><option value="same">Everything matches the form</option><option value="maturity">Maturity date differs</option><option value="amount">Amount differs</option><option value="norecord">Bank has no record</option></select></div>'+
   '<div class="acts full"><button class="btn pri" type="submit">'+(old?'Submit renewal':'Submit for verification')+'</button><button class="btn" type="button" data-a="close">Cancel</button></div></form>';
}
var renewOf=null;
function submitForm(){
  var g=function(id){return $('#ff-'+id).value.trim();};
  var errs={};
  var no=g('no'),bank=g('bank'),amount=Number(g('amount')),issued=g('issued'),mat=g('maturity');
  if(!no)errs.no='Enter the FDR or reference number.';
  else if(fdrs.some(function(f){return f.no===no;}))errs.no='This number is already registered.';
  if(!bank)errs.bank='Enter the issuing bank.';
  if(!(amount>0))errs.amount='Enter an amount greater than zero.';
  if(!issued)errs.issued='Choose the issue date.';
  if(!mat)errs.maturity='Choose the maturity date.';
  else if(issued&&mat<=issued)errs.maturity='Maturity must be after the issue date.';
  ['no','bank','amount','issued','maturity'].forEach(function(k){var e=$('#err-'+k);if(e)e.textContent=errs[k]||'';});
  if(Object.keys(errs).length){var first=Object.keys(errs)[0];$('#ff-'+first).focus();return;}
  var file=$('#ff-file').files[0];
  var lock=new Date(parse(issued));lock.setDate(lock.getDate()+365);
  var f=mk({id:'f'+(++seq),no:no,type:g('type'),inst:g('inst'),bank:bank,branch:g('branch'),amount:Math.round(amount),issued:issued,maturity:mat,lockIn:fmtISO(lock),lien:g('lien'),file:file?file.name:'sample-scan.pdf',scan:g('scan'),wf:'pending',renewalOf:renewOf?renewOf.id:null});
  var bad=mismatches(f),feedOk=f.feed.status==='Confirmed';
  if(bad.length||!feedOk)f.wf='discrepancy';
  fdrs.push(f);
  if(renewOf){renewOf.wf='renewal_submitted';renewOf.renewedBy=f.id;addAudit('RENEWAL_UPLOADED',f.id,actor(),'Renewal of '+renewOf.no);}
  else addAudit('SUBMITTED',f.id,actor(),'Submitted '+f.type+' of '+inr(f.amount));
  if(f.wf==='discrepancy'){
    var why=!feedOk?'Bank feed has no record of this instrument':bad.map(function(k){return KEYS.filter(function(x){return x[0]===k;})[0][1].toLowerCase();}).join(', ')+' on scan differ'+(bad.length>1?'':'s')+' from form';
    addAudit('DISCREPANCY_FLAGGED',f.id,'System (OCR + bank feed)',why);
  }
  renewOf=null;closeLayer();
  state.vsel=f.id;location.hash='verification';
  state.view='verification';render();
  toast(f.wf==='discrepancy'?'Submitted. The scan check found a discrepancy.':'Submitted. The scan matches the bank feed.');
}

/* ---------- actions ---------- */
function remarks(){var r=$('#remarks');return r&&r.value.trim()?' Remarks: '+r.value.trim():'';}
function verifyOne(f,note,action){
  f.wf='verified';addAudit(action||'VERIFIED',f.id,actor(),note+remarks());
  if(f.renewalOf){var o=get(f.renewalOf);if(o){o.wf='renewed';addAudit('ARCHIVED',o.id,'System','Replaced by '+f.no);}}
}
var A={
 open:function(id){state.sel=id;layer('drawer',panelHTML(id));},
 close:function(){renewOf=null;closeLayer();},
 newfdr:function(){renewOf=null;layer('dialog',formHTML(null));$('#ff-no').focus();},
 renew:function(id){renewOf=get(id);layer('dialog',formHTML(renewOf));$('#ff-no').focus();},
 filter:function(id,el){state.filter=el.dataset.v;render();},
 afilter:function(id,el){state.alertF=el.dataset.v;render();},
 vsel:function(id){state.vsel=id;render();},
 goverify:function(id){closeLayer();state.vsel=id;location.hash='verification';state.view='verification';render();},
 verify:function(id){var f=get(id);verifyOne(f,'Scan and bank feed match.');state.vsel=null;render();toast('Verified.');},
 resolve:function(id){
   var f=get(id);var fixed=mismatches(f);
   fixed.forEach(function(k){f[k]=f.feed[k];});f.ocr=Object.assign({},f.ocr,{no:f.no,bank:f.bank,amount:f.amount,maturity:f.maturity});
   verifyOne(f,'Corrected '+fixed.length+' field'+(fixed.length>1?'s':'')+' to bank-verified values.','DISCREPANCY_RESOLVED');
   state.vsel=null;render();toast('Corrected to bank values and verified.');
 },
 requery:function(id){
   var f=get(id);
   if(f.feed.status!=='Confirmed'){f.feed=Object.assign({status:'Confirmed'},{no:f.no,bank:f.bank,amount:f.amount,maturity:f.maturity});addAudit('BANK_QUERY',f.id,actor(),'Bank feed now confirms the instrument');if(!mismatches(f).length&&f.wf==='discrepancy')f.wf='pending';toast('Bank confirmed the instrument.');}
   else{addAudit('BANK_QUERY',f.id,actor(),'Bank feed re-queried, no change');toast('Bank feed unchanged.');}
   render();
 },
 reject:function(id){
   var f=get(id);f.wf='rejected';addAudit('REJECTED',f.id,actor(),'Submission rejected.'+remarks());
   if(f.renewalOf){var o=get(f.renewalOf);if(o&&o.wf==='renewal_submitted'){o.wf='verified';o.renewedBy=null;}}
   state.vsel=null;render();toast('Rejected. The institution can submit again.');
 },
 release:function(id){var f=get(id);f.wf='release_requested';f.approvals=[];addAudit('RELEASE_REQUESTED',f.id,actor(),'Lock-in complete');render();layer('drawer',panelHTML(id));toast('Release requested. It needs two sign-offs.');},
 approve:function(id){
   var f=get(id),r=state.role;
   if(r==='regional'&&f.approvals.length===0){f.approvals.push({tier:1,by:ROLES.regional.name,role:ROLES.regional.label,at:off(0)});addAudit('RELEASE_APPROVED',f.id,actor(),'Tier 1 sign-off');toast('Tier 1 approved. Waiting for the Bureau Officer.');}
   else if(r==='bureau'&&f.approvals.length===1){f.approvals.push({tier:2,by:ROLES.bureau.name,role:ROLES.bureau.label,at:off(0)});f.wf='released';addAudit('RELEASE_APPROVED',f.id,actor(),'Tier 2 sign-off');addAudit('RELEASED',f.id,'System','Release instruction issued to bank');toast('Released.');}
   render();layer('drawer',panelHTML(id));
 },
 runscan:function(){
   var A_=alertsList().filter(function(a){return !state.sent[a.key];});
   if(!A_.length)return;
   A_.forEach(function(a){state.sent[a.key]=true;if(a.esc)addAudit('ESCALATED',a.f.id,'System','Escalated to Bureau Officer: '+(a.th==='OVERDUE'?'overdue and not renewed':'matures within 7 days'));});
   addAudit('ALERTS_DISPATCHED','','System',A_.length+' alert'+(A_.length>1?'s':'')+' sent by email and in-app to SPOCs and Regional Officers');
   render();toast(A_.length+' alert'+(A_.length>1?'s':'')+' sent.');
 },
 chain:function(){
   for(var k=0;k<audit.length;k++){var e=audit[k];var p=k?audit[k-1].hash:'00000000';if(e.prev!==p||entryHash(e)!==e.hash){toast('Chain broken at entry '+e.n+'.');return;}}
   toast('Chain verified. All '+audit.length+' entries are intact.');
 }
};

/* ---------- shell ---------- */
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},3200);}
function layer(kind,html){var L=$('#layer');L.className='layer '+kind;L.innerHTML='<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" tabindex="-1">'+html+'</div>';L.hidden=false;document.body.classList.add('lock');$('.sheet',L).focus();}
function closeLayer(){var L=$('#layer');L.hidden=true;L.innerHTML='';state.sel=null;document.body.classList.remove('lock');}
var TITLES={
 dashboard:['Dashboard',function(){return 'Position as of '+fmtDate(fmtISO(TODAY))+'.';}],
 repository:['Repository',function(){return 'Every FDR, bank guarantee and security deposit on record.';}],
 verification:['Verification',function(){return 'Submitted values checked against the scan and the bank feed.';}],
 alerts:['Alerts',function(){return 'Maturity notices at 90, 60, 30 and 7 days, then overdue.';}],
 audit:['Audit trail',function(){return 'Every action, in order, each linked to the one before.';}]
};
function render(){
  var nav=VIEWS.map(function(v){
    var c=v==='verification'?queue().length:v==='alerts'?alertsList().filter(function(a){return !state.sent[a.key];}).length:0;
    return '<button type="button" data-a="nav" data-v="'+v+'"'+(state.view===v?' aria-current="page"':'')+'>'+TITLES[v][0]+(c?'<span class="count">'+c+'</span>':'')+'</button>';
  }).join('');
  $('#nav').innerHTML=nav;
  $('#title').textContent=TITLES[state.view][0];
  var sub=TITLES[state.view][1]();
  if(state.role==='spoc')sub+=' Showing '+inst(ROLES.spoc.inst).name+' only.';
  $('#sub').textContent=sub;
  $('#role').value=state.role;
  $('#view').innerHTML={dashboard:vDash,repository:vRepo,verification:vVerify,alerts:vAlerts,audit:vAudit}[state.view]();
  if(state.sel&&!$('#layer').hidden){var sh=$('#layer .sheet');if(sh&&$('#layer').classList.contains('drawer')){var sc=sh.scrollTop;sh.innerHTML=panelHTML(state.sel);sh.scrollTop=sc;}}
}
function route(){
  var h=location.hash.slice(1);
  if(VIEWS.indexOf(h)>-1&&h!==state.view){state.view=h;closeLayer();}
  render();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a;
  if(a==='nav'){location.hash=t.dataset.v;state.view=t.dataset.v;closeLayer();render();return;}
  if(A[a]){e.preventDefault();A[a](t.dataset.id,t);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#layer').hidden){renewOf=null;closeLayer();}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-a="open"]')){A.open(e.target.dataset.id);}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){state.q=e.target.value;$('#repoBody').innerHTML=repoRows();}
  if(e.target.id==='aq'){state.aQ=e.target.value;var p=e.target.selectionStart;render();var n=$('#aq');n.focus();n.setSelectionRange(p,p);}
});
document.addEventListener('change',function(e){
  if(e.target.id==='af'){state.aF=e.target.value;render();}
  if(e.target.id==='role'){state.role=e.target.value;closeLayer();state.vsel=null;render();toast('Now viewing as '+ROLES[state.role].label+'.');}
});
document.addEventListener('submit',function(e){if(e.target.id==='fdrForm'){e.preventDefault();submitForm();}});
window.addEventListener('hashchange',route);
route();
})();
</script>

</body></html>
